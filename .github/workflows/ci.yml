name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install
        working-directory: web/admin
        run: npm ci
      - name: Type check
        working-directory: web/admin
        run: npm run check
      - name: Build embedded assets
        working-directory: web/admin
        run: npm run build
      - name: Verify generated assets are committed
        run: git diff --exit-code -- internal/adminui/dist

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  installer:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
