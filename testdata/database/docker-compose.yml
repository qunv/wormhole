services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "55432:5432"
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/001-codebridge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
    ports:
      - "53306:3306"
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/001-codebridge.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot"]
      interval: 3s
      timeout: 3s
      retries: 40
