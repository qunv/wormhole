version: 2

project_name: codebridge

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: codebridge
    main: ./cmd/codebridge
    binary: codebridge
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X codebridge/internal/app.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
